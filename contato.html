<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatArt | Artista & Visual Art</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
	<main>
		<!-- Cabeçalho / Logo -->
	<header class="header">
			<div class="logo-container">
				<div class="logo-header">
					<span class="logo-icon">♠</span>
					<span class="logo-text">NatArt</span>
				</div>
				<span class="logo-subtitle"> Artista | Visual Art </span>
			</div>

        <nav class="nav-menu">
			<a href="index.html"> Principal </a>
            <a href="galeria.html" class="acttive"> Galeria </a>
            <a href="sobre.html"> Sobre </a>
            <a href="contato.html"> Contato </a>
        </nav>
    </header>
			<form action="https://formspree.io/f/xqpakjdz" method="POST" class="form-contato">
        
				<div class="campo">
					<label for="nome">Nome</label>
					<input type="text" id="nome" name="name" required placeholder="Seu nome">
				</div>
				
				<div class="campo">
					<label for="telefone">Telefone</label>
					<input type="telefone" id="telefone" name="telefone" required placeholder="(55) 9999-9999">
				</div>

				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
				</div>

				<div class="campo">
					<label for="mensagem">Mensagem</label>
					<textarea id="mensagem" name="message" rows="5" required placeholder="Digite sua mensagem aqui..."></textarea>
				</div>
			<button type="submit" class="btn-enviar">ENVIAR MENSAGEM</button>
    </form>
		<!-- Rodapé -->
		<footer id="contato" class="footer">
			<p>Entre em contato: <strong>contato@natart.com</strong></p>
			<p>&copy; 2026 NatArt. Todos os direitos reservados.</p>
		</footer>
	</main>
</body>
</html>
